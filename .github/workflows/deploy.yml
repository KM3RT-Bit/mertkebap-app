name: Deploy Angular App

on:
  push:
    branches:
      - ren

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build -- --base-href /mertkebap-app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/webapp/browser

  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/deploy-pages@v4
