name: Create PR from ren to main

on:
  push:
    branches: [ ren ]

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: ren
          title: "Automated PR: ren → main"
          body: "This PR was created automatically from branch `ren` to `main`."
          draft: false
          labels: automated
